name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: macos-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go tool staticcheck ./...
      - run: go test ./...
      - run: go test -race ./internal/proc ./internal/agent ./internal/hub ./internal/updater ./internal/usage ./internal/transport/mygoipc ./internal/runtime/acp ./internal/runtime/claude ./internal/runtime/codex ./internal/runtime/pi ./internal/provider ./internal/relay/... ./internal/transport/remote
      - run: go tool mygo vet .
